name: Build VS Code extension

on:
  push:
    branches: [master]
  pull_request:

# Read-only by default; the release job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_vscode_ext:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'bazel-contrib/vscode-bazel' }} # Allow CI-runs only for events from/to this repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install buildifier
        uses: ./.github/actions/install-buildifier
        with:
          version: "8.2.1"

      # Bazel provides Node.js and all npm dependencies; no npm install needed.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The integration tests run bazel inside this fixture workspace. Building
      # it up front catches fixture breakage early and warms bazelisk's cache.
      - name: Build the test fixture workspace
        run: bazel build //...
        working-directory: ${{ github.workspace }}/test/bazel_workspace/

      # Required for the test cases
      - name: Install system dependencies
        run: sudo apt install -y binutils rustfilt

      # Fails if package.json changed without `bazel run //:pnpm -- install
      # --lockfile-only` being run (Renovate and Dependabot do this themselves).
      - name: Check pnpm-lock.yaml matches package.json
        run: bazel run //:pnpm -- install --lockfile-only --frozen-lockfile

      # Typecheck, lint, format check, buildifier, grammar snapshot and VS
      # Code integration tests. xvfb provides the display VS Code needs.
      - name: Test
        run: xvfb-run -a bazel test //...

      # Writes vscode-bazel-<version>.vsix into the checkout for the artifact
      # step below.
      - name: Package VS Code extension
        run: bazel run //:export_vsix

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-bazel-prerelease.vsix
          path: vscode-bazel-*.vsix
          if-no-files-found: error

  release:
    name: Release
    needs: build_vscode_ext
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'bazel-contrib/vscode-bazel' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write # create the release and upload its asset
      pull-requests: write # open and update the release PR
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: node

      # Only when a release was just created: build the .vsix again from the
      # released commit and attach it.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Upload Release Artifact
        if: ${{ steps.release.outputs.release_created }}
        run: bazel run //:upload_release_asset -- "${{ steps.release.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
